[project]
name = "agentic-graphrag-benchmark"
version = "0.1.0"
description = "Three-way RAG vs GraphRAG vs Agentic GraphRAG benchmark on TigerGraph Savanna"
requires-python = ">=3.11"
dependencies = [
    "pyTigerGraph>=1.8",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "streamlit>=1.38",
    "plotly>=5.22",
    "networkx>=3.3",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# === Ruff ===
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

# === Pytest ===
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests (no network)",
    "contract: pipeline contract tests",
    "behavior: agentic behavior tests",
    "integration: live Savanna + Gemini tests",
    "regression: regression benchmark tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

# === Mypy ===
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src/contracts.py", "src/llm", "src/agentic"]
