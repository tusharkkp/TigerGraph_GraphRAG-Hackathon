# Model configuration — all model names referenced from here, never hardcoded
# Roles map to specific models; change here to switch globally.

roles:
  # Used by all three pipelines for final answer generation
  answer:
    model: "gemini-3.1-flash-lite-preview"
    temperature: 0.0
    max_output_tokens: 2048

  # Used by the agentic orchestrator for planning
  orchestrator:
    model: "gemini-3.1-flash-lite-preview"
    temperature: 0.0
    max_output_tokens: 1024

  # Used by specialised agents (entity linker, evidence evaluator, etc.)
  agent:
    model: "gemini-3.1-flash-lite-preview"
    temperature: 0.0
    max_output_tokens: 1024

  # Used by the evaluation judge — robust, high-RPM, reliable structured evaluation
  judge:
    model: "gemini-3.1-flash-lite-preview"
    temperature: 0.0
    max_output_tokens: 512

  # Used for entity/relation extraction during ingestion
  extract:
    model: "gemini-3.1-flash-lite-preview"
    temperature: 0.0
    max_output_tokens: 4096

# Embedding model — ADR-007 local default, Gemini optional
embedding:
  provider: "local"
  model: "BAAI/bge-base-en-v1.5"
  revision: "main"
  dimensions: 768
  runtime: "fastembed"
  query_prefix: "Represent this sentence for searching relevant passages: "
  doc_prefix: ""
  max_seq_length: 512
  batch_size: 32
  gemini_model: "gemini-embedding-001"
  task_type: "RETRIEVAL_DOCUMENT"
  query_task_type: "RETRIEVAL_QUERY"

# Rate limiting
rate_limits:
  requests_per_minute: 60
  max_concurrent: 5
  retry_max_attempts: 5
  retry_base_delay: 1.0
  retry_max_delay: 60.0
